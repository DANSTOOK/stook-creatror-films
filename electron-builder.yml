appId: com.stook.creatorfilms
productName: STOOK CREATOR FILMS
# No spaces in the installer file name: it becomes a download URL.
artifactName: SCF-Setup-${version}.${ext}
directories:
  output: release
  buildResources: build

# The default file set is replaced by whatever is listed here, so node_modules
# has to be named explicitly. Leaving it out silently shipped a build with no
# ffmpeg in it at all - the app started and could not export a thing.
files:
  - dist/**
  - dist-electron/**
  - package.json
  - node_modules/**

# ffmpeg is spawned as a child process, and a binary inside an asar archive
# cannot be executed. resolveFfmpegPath() rewrites app.asar to
# app.asar.unpacked, which only works if it is actually unpacked here.
asarUnpack:
  - node_modules/ffmpeg-static/**
  # Remove background (src/main/matting): onnxruntime-node is a native addon
  # whose DLLs (onnxruntime, DirectML) must sit beside it on disk for Windows
  # to load them - nothing inside an asar can be loaded as a library.
  - node_modules/onnxruntime-node/bin/**

# The speech-to-text engine behind captions (whisper.cpp), compiled by the
# release workflow into build/whisper and found by the app in
# resources/whisper (src/main/subtitles/engine.ts). A program, so it goes
# beside the asar rather than in it. The speech MODELS are not here: they are
# downloaded when the user asks, into the app's data folder.
# In a checkout without build/whisper nothing is copied, and the app says
# captions cannot be generated in this build.
extraResources:
  - from: build/whisper
    to: whisper
    filter:
      - '**/*'
  # The text-to-speech engine: Piper (main/tts/engine.ts), a standalone
  # program spawned as a child process the way whisper and ffmpeg are. Its
  # espeak-ng phonemiser (GPL-3.0) lives inside this separate executable with
  # its licence beside it, and is never linked into the app. The release
  # workflow stages it into build/piper; a checkout without it says text to
  # speech is not part of the build.
  - from: build/piper
    to: piper
    filter:
      - '**/*'
  # The voices that ship ready to use (main/tts/catalog.ts BUNDLED_VOICES):
  # five Piper voices with commercially usable licences (CC0, public domain,
  # Apache, permissive attribution). Extra voices are downloaded on request
  # into the app's data folder. Each voice is its .onnx plus its .onnx.json.
  - from: build/tts-voices
    to: tts-voices
    filter:
      - '**/*'
  # One speech model bundled so captions work with no download on first use
  # (ggml-small-q5_1, chosen in .bench-tmp/tts-spike.md). The other models stay
  # downloadable, into the app's data folder, as before.
  - from: build/whisper-models
    to: whisper-models
    filter:
      - '**/*'

win:
  target: [nsis]
  # onnxruntime-node carries every platform's binaries (about 300 MB); a
  # Windows installer needs only its own, 64 MB of them. The matting models
  # are not here either: they are downloaded when the person asks.
  # The whole file set is repeated: a platform list of exclusions alone is
  # read as "everything except", and packed the whole checkout.
  files:
    - dist/**
    - dist-electron/**
    - package.json
    - node_modules/**
    - '!node_modules/onnxruntime-node/bin/napi-v6/{linux,darwin}/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
mac:
  target: [dmg]
  category: public.app-category.video
linux:
  target: [AppImage]
  category: AudioVideo
