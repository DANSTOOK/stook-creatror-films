# Pushing a tag like v1.2.0 builds the Windows installer and publishes it as a
# GitHub Release. Nothing else creates releases.
#
# electron-builder runs with --publish never on purpose: it publishes on its own
# whenever it detects a tag in CI, and then two things would be racing to
# create the same release. The release is made here, with gh, instead.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  # The speech-to-text engine behind captions: whisper.cpp (MIT), pinned to
  # the commit of its v1.9.4 release. Changing it changes what ships: test
  # captions (npm run test:captions:ui) against the new build before tagging.
  WHISPER_COMMIT: 927cfce34f31707e17f2bff35c349632fb9e2c3a
  # Needed to COMPILE the Vulkan backend only. Nothing of it is installed on
  # the user's computer: the build uses the Vulkan driver their GPU already has.
  VULKAN_SDK_VERSION: 1.4.313.2
  # The Silero voice detector (885 KB, MIT) keeps Whisper from writing over
  # music: only what it hears as speech is transcribed. Measured before it
  # was turned on (npm run test:bench:captions-vad, and the CHANGELOG): the
  # same words and the same times, and no caption made up over music.
  # The app puts the word times back through the table the engine prints
  # (`vad_segment_info:` lines) - after changing WHISPER_COMMIT, run that
  # bench: it fails if the table is no longer printed that way.
  # The file is checked against this SHA-256; a different one fails the build.
  BUNDLE_VAD: 'true'
  VAD_FILE: ggml-silero-v6.2.0.bin
  VAD_SHA256: 2aa269b785eeb53a82983a20501ddf7c1d9c48e33ab63a41391ac6c9f7fb6987

  # The speech model bundled so captions work with no download on first use
  # (chosen in .bench-tmp/tts-spike.md: ggml-small-q5_1, 190 MB, measured far
  # more accurate than base-q5_1 in Spanish and English). The other models stay
  # downloadable at run time. The same SHA-256 the catalogue pins (main/
  # subtitles/catalog.ts); a different file fails the build.
  CAPTIONS_BUNDLE_FILE: ggml-small-q5_1.bin
  CAPTIONS_BUNDLE_SHA256: ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb

  # The text-to-speech engine: Piper's Windows build, spawned as a child
  # process the way whisper and ffmpeg are. Piper and piper_phonemize are MIT;
  # the espeak-ng data inside the zip is GPL-3.0 and ships in its own
  # executable, never linked into the app. Pinned by release tag and checksum.
  PIPER_VERSION: '2023.11.14-2'
  PIPER_ZIP: piper_windows_amd64.zip
  PIPER_SHA256: f3c58906402b24f3a96d92145f58acba6d86c9b5db896d207f78dc80811efcea

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A release is never cut from a red build.
      - run: npm run typecheck
      - run: npm test

      # The tag and package.json must agree, or the installer is named after
      # a version that is not the one being released.
      - name: Check tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      # --- The speech-to-text engine -------------------------------------------
      # Built here rather than downloaded: upstream publishes Windows builds
      # for the CPU and for CUDA (675 MB), none with Vulkan. Vulkan runs on
      # NVIDIA, AMD and Intel GPUs with the driver that is already there.
      #
      # Dynamic backends (GGML_BACKEND_DL): ggml-vulkan.dll is loaded only if
      # the computer has a Vulkan driver; without one, or without a GPU worth
      # using, the same whisper-cli.exe runs on the CPU with the variant for
      # that processor (GGML_CPU_ALL_VARIANTS). GGML_NATIVE=OFF: built for any
      # x64 processor, not for the runner's.
      #
      # It lands in build/whisper, which electron-builder copies into the
      # installer as resources/whisper (extraResources in electron-builder.yml)
      # and the app finds there (src/main/subtitles/engine.ts).
      - name: Cache the speech engine
        id: whisper
        uses: actions/cache@v4
        with:
          path: build/whisper
          key: whisper-${{ env.WHISPER_COMMIT }}-vulkan-${{ env.VULKAN_SDK_VERSION }}-vad-${{ env.BUNDLE_VAD }}-1

      - name: Install the Vulkan SDK (to compile only)
        if: steps.whisper.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK.exe'
          curl.exe -fL -o $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          $run = Start-Process -FilePath $installer -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "The Vulkan SDK installer exited with $($run.ExitCode)" }
          # Where the installer puts it; CMake's FindVulkan reads VULKAN_SDK.
          $sdk = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { throw "The Vulkan SDK is not in $sdk" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Fetch whisper.cpp
        if: steps.whisper.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ env.WHISPER_COMMIT }}
          path: .whisper-src

      - name: Build whisper.cpp with Vulkan
        if: steps.whisper.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cmake -S .whisper-src -B .whisper-build -A x64 `
            -DBUILD_SHARED_LIBS=ON `
            -DWHISPER_SDL2=OFF `
            -DWHISPER_BUILD_TESTS=OFF `
            -DGGML_NATIVE=OFF `
            -DGGML_BACKEND_DL=ON `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_VULKAN=ON
          if ($LASTEXITCODE -ne 0) { throw 'cmake could not configure whisper.cpp' }
          cmake --build .whisper-build --config Release -j
          if ($LASTEXITCODE -ne 0) { throw 'whisper.cpp did not build' }

          # Only what the app runs: the program, its libraries, the backends.
          $out = 'build/whisper'
          New-Item -ItemType Directory -Force $out | Out-Null
          $bin = '.whisper-build/bin/Release'
          Copy-Item "$bin/whisper-cli.exe", "$bin/whisper.dll", "$bin/ggml.dll", "$bin/ggml-base.dll" $out
          Copy-Item "$bin/ggml-cpu-*.dll", "$bin/ggml-vulkan.dll" $out
          Copy-Item .whisper-src/LICENSE "$out/LICENSE-whisper.cpp.txt"
          if (-not (Test-Path "$out/ggml-vulkan.dll")) { throw 'The Vulkan backend was not built' }

          # The voice detector, from its one source, with its licence beside
          # whisper.cpp's. A file that is not the one measured is not kept;
          # the next step checks it again, cached or not.
          if ($env:BUNDLE_VAD -eq 'true') {
            $vad = "$out/$env:VAD_FILE"
            curl.exe -fL -o $vad "https://huggingface.co/ggml-org/whisper-vad/resolve/main/$env:VAD_FILE"
            if ($LASTEXITCODE -ne 0) { throw 'The voice detector could not be downloaded' }
            $hash = (Get-FileHash $vad -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $env:VAD_SHA256) {
              Remove-Item $vad
              throw "The voice detector's checksum is $hash, not $env:VAD_SHA256"
            }
            Copy-Item build/LICENSE-silero-vad.txt "$out/LICENSE-silero-vad.txt"
          }

      # A release never ships an engine that does not start. The runner has
      # no GPU, so this is also the CPU fallback being exercised.
      - name: Check the speech engine starts
        shell: pwsh
        run: |
          Get-ChildItem build/whisper | Format-Table Name, Length
          $help = & build/whisper/whisper-cli.exe --help 2>&1 | Out-String
          if ($help -notmatch 'usage:') { throw "whisper-cli did not start:`n$help" }
          if ($help -notmatch 'loaded CPU backend') { throw "whisper-cli found no CPU backend:`n$help" }
          # Nor a voice detector that is not, byte for byte, the one measured.
          if ($env:BUNDLE_VAD -eq 'true') {
            $vad = "build/whisper/$env:VAD_FILE"
            if (-not (Test-Path $vad)) { throw "The voice detector is not in build/whisper" }
            $hash = (Get-FileHash $vad -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $env:VAD_SHA256) { throw "The voice detector's checksum is $hash, not $env:VAD_SHA256" }
            if (-not (Test-Path build/whisper/LICENSE-silero-vad.txt)) { throw "The voice detector's licence is not beside it" }
            if ($help -notmatch '--vad') { throw "This whisper-cli has no --vad option:`n$help" }
          }

      # --- The bundled captions model ------------------------------------------
      # Fetched here so the installer carries it (electron-builder.yml ships
      # build/whisper-models as resources/whisper-models). Verified against the
      # catalogue's SHA-256.
      - name: Stage the bundled captions model
        shell: pwsh
        run: |
          $out = 'build/whisper-models'
          New-Item -ItemType Directory -Force $out | Out-Null
          $file = "$out/$env:CAPTIONS_BUNDLE_FILE"
          curl.exe -fL -o $file "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$env:CAPTIONS_BUNDLE_FILE"
          if ($LASTEXITCODE -ne 0) { throw 'The captions model could not be downloaded' }
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:CAPTIONS_BUNDLE_SHA256) {
            Remove-Item $file
            throw "The captions model's checksum is $hash, not $env:CAPTIONS_BUNDLE_SHA256"
          }

      # --- The text-to-speech engine -------------------------------------------
      - name: Cache the text-to-speech engine
        id: piper
        uses: actions/cache@v4
        with:
          path: build/piper
          key: piper-${{ env.PIPER_VERSION }}-${{ env.PIPER_SHA256 }}

      - name: Stage Piper
        if: steps.piper.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP $env:PIPER_ZIP
          curl.exe -fL -o $zip "https://github.com/rhasspy/piper/releases/download/$env:PIPER_VERSION/$env:PIPER_ZIP"
          if ($LASTEXITCODE -ne 0) { throw 'Piper could not be downloaded' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:PIPER_SHA256) { throw "Piper's checksum is $hash, not $env:PIPER_SHA256" }
          # The zip holds a top-level piper/ folder; its contents become build/piper.
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP/piper-x -Force
          New-Item -ItemType Directory -Force build/piper | Out-Null
          Copy-Item "$env:RUNNER_TEMP/piper-x/piper/*" build/piper -Recurse -Force
          if (-not (Test-Path build/piper/piper.exe)) { throw 'piper.exe is not in build/piper' }
          # espeak-ng is GPL-3.0; its licence and a source offer travel with it.
          @"
          Piper (piper.exe, piper_phonemize.dll) is MIT-licensed:
            https://github.com/rhasspy/piper  (release $env:PIPER_VERSION)
          It bundles espeak-ng, licensed GPL-3.0:
            https://github.com/espeak-ng/espeak-ng
          espeak-ng is provided here as a separate executable and is not linked
          into STOOK CREATOR FILMS. Its complete corresponding source for this
          version is available from the espeak-ng project above; a copy can also
          be obtained from the publisher of this application on request.
          "@ | Out-File -FilePath build/piper/LICENSE-piper-espeak-ng.txt -Encoding utf8

      # --- The bundled voices --------------------------------------------------
      # Each voice is its .onnx weights and .onnx.json configuration, fetched
      # from rhasspy/piper-voices and verified against the SHA-256 recorded with
      # the spike. Only voices with commercially usable licences are listed.
      - name: Stage the bundled voices
        shell: pwsh
        run: |
          $base = 'https://huggingface.co/rhasspy/piper-voices/resolve/main'
          $out = 'build/tts-voices'
          New-Item -ItemType Directory -Force $out | Out-Null
          # path (under the repo) | sha256
          $voices = @(
            @{ path = 'es/es_ES/davefx/medium/es_ES-davefx-medium.onnx'; sha = '6658b03b1a6c316ee4c265a9896abc1393353c2d9e1bca7d66c2c442e222a917' },
            @{ path = 'es/es_ES/davefx/medium/es_ES-davefx-medium.onnx.json'; sha = '0e0dda87c732f6f38771ff274a6380d9252f327dca77aa2963d5fbdf9ec54842' },
            @{ path = 'es/es_ES/sharvard/medium/es_ES-sharvard-medium.onnx'; sha = '40febfb1679c69a4505ff311dc136e121e3419a13a290ef264fdf43ddedd0fb1' },
            @{ path = 'es/es_ES/sharvard/medium/es_ES-sharvard-medium.onnx.json'; sha = '7438c9b699c72b0c3388dae1b68d3f364dc66a2150fe554a1c11f03372957b2c' },
            @{ path = 'es/es_MX/claude/high/es_MX-claude-high.onnx'; sha = '3ef40a71ea63852cd8ab7e6fa7d2ecdcfa67a0b47c9c48e3f10e02ee02083ea0' },
            @{ path = 'es/es_MX/claude/high/es_MX-claude-high.onnx.json'; sha = '1afc81f703c0e4cb3b4d7c0dca096b8b54a98806807f0170cf5eb5557723c12d' }
          )
          foreach ($v in $voices) {
            $name = Split-Path $v.path -Leaf
            $dest = "$out/$name"
            curl.exe -fL -o $dest "$base/$($v.path)"
            if ($LASTEXITCODE -ne 0) { throw "Could not download $name" }
            $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $v.sha) { Remove-Item $dest; throw "$name checksum is $hash, not $($v.sha)" }
          }
          # The English voices come from the sherpa-onnx mirror, where the
          # rhasspy originals are republished unchanged.
          $en = @(
            @{ url = 'https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-kristin-medium.tar.bz2'; file = 'en_US-kristin-medium'; sha = 'f9a5c375c70ddc33ccdb3969c76a4d7cc5255ac08119a312b0034a1d07041be6' },
            @{ url = 'https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-norman-medium.tar.bz2'; file = 'en_US-norman-medium'; sha = 'fa06b6b8b280e176b17f8424e05ca12d0223eeac9a31c87230937fe7120fbe2a' }
          )
          foreach ($v in $en) {
            $tar = Join-Path $env:RUNNER_TEMP "$($v.file).tar.bz2"
            curl.exe -fL -o $tar $v.url
            if ($LASTEXITCODE -ne 0) { throw "Could not download $($v.file)" }
            tar -xjf $tar -C $env:RUNNER_TEMP
            $src = "$env:RUNNER_TEMP/vits-piper-$($v.file)"
            Copy-Item "$src/$($v.file).onnx" "$out/" -Force
            Copy-Item "$src/$($v.file).onnx.json" "$out/" -Force
            $hash = (Get-FileHash "$out/$($v.file).onnx" -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $v.sha) { throw "$($v.file).onnx checksum is $hash, not $($v.sha)" }
          }
          Get-ChildItem $out | Format-Table Name, Length

      - name: Check the text-to-speech engine runs
        shell: pwsh
        run: |
          Get-ChildItem build/piper | Format-Table Name, Length
          'Hola, esto es una prueba.' | & build/piper/piper.exe --model build/tts-voices/es_ES-davefx-medium.onnx --output_file $env:RUNNER_TEMP/piper-check.wav
          if ($LASTEXITCODE -ne 0) { throw 'piper.exe did not run' }
          if (-not (Test-Path $env:RUNNER_TEMP/piper-check.wav)) { throw 'piper produced no audio' }

      - name: Build installer
        run: npm run build && node ./node_modules/electron-builder/cli.js --win --publish never

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a hyphen (v1.2.0-beta.1) are published as pre-releases.
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-from-tag \
            $flags \
            release/*.exe
